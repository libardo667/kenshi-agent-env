# Canonical live configuration for ordinary play.
# The planner, action catalog, and safety gates all belong to this one path.
version: 1
mode: live

control:
  mode: native_assisted
  native_assisted_actions_enabled: true

planning:
  mode: continuous
  observation_pump_enabled: true
  # The contracted semantic approach always runs as a monitored option; these
  # are its arrival/threat radii, not a feature flag.
  semantic_approach_arrival_distance: 5.0
  semantic_approach_threat_distance: 15.0
  # Only an option that remains active past the holdoff earns a concurrent
  # strategic call. Short movement should finish without model work to discard.
  concurrent_option_planning_enabled: true
  concurrent_option_planning_delay_seconds: 20
  observation_pump_seconds: 0.1
  state_history_limit: 128
  state_delta_limit: 128
  event_journal_limit: 256
  subscriber_queue_limit: 32
  max_delta_paths: 128
  max_plan_steps: 8
  max_actions_per_plan: 16
  max_plan_wall_seconds: 360
  # Kenshi's elapsed_minutes is accelerated game time, not movement-pulse
  # wall time. This ceiling covers the longest audited eight-second pulse
  # plus one wall-second at the conservative 60x conversion.
  max_plan_game_seconds: 3600
  max_pointer_actions_per_plan: 16
  # One strategic purchase may ask the controller to conserve up to five
  # identical units without another planner call.
  max_purchase_actions_per_plan: 5
  max_native_assisted_actions_per_plan: 4
  max_consecutive_replans: 20
  # The world runs while the agent thinks, so per-plan game-time budgets
  # would measure deliberation rather than action.
  require_paused_between_actions: false

paths:
  runs_dir: ../runs
  prompt_file: ../prompts/planner_system.md
  memory_db: ${LOCALAPPDATA}/KenshiAgent/state/live-memory.sqlite3

runtime:
  max_steps: 30
  settle_seconds: 0.75
  observation_memory_limit: 16
  decision_stream: true
  objective: >-
    You're playing Kenshi. Decide a goal for yourself and work your way
    towards completing it. You have the run of the interface. Open the
    inventory, map and stats windows with their bindings, move the camera,
    travel to discovered settlements, walk to people and
    talk to them, buy and sell.
    You can also harvest a bounded yield from an exact observed resource into
    the selected character as one controller-owned action.
    Information gathering is part of play: explore, scout, inspect your own
    state, open useful interfaces, talk to people, and browse shops when what
    you learn could change the next meaningful choice. Prefer a grounded
    information-seeking action over guessing. Do not repeat an unchanged look
    or gather information with no decision it could affect.

planner:
  kind: openrouter
  reasoning_effort: ${KENSHI_AGENT_REASONING_EFFORT:-low}
  openrouter_model: ${KENSHI_AGENT_OPENROUTER_MODEL:-google/gemini-3.1-flash-lite}
  openrouter_provider_sort: ${KENSHI_AGENT_OPENROUTER_SORT:-latency}
  openrouter_require_parameters: true
  temperature: 0.1
  timeout_seconds: 90
  max_output_tokens_base: 4096
  max_output_tokens_per_plan_step: 2048
  max_output_tokens_ceiling: 12288
  # Preserve a length-terminated thought through bounded provider continuation
  # instead of discarding it and asking the model to regenerate from scratch.
  max_output_continuations: 2
  include_screenshot: true
  screenshot_detail: high

advisor:
  enabled: true
  provider: openrouter
  # Deliberately stronger than the fast playing model. Override independently
  # without changing the planner route.
  model: ${KENSHI_AGENT_ADVISOR_MODEL:-openai/gpt-5.4}
  base_url: https://openrouter.ai/api/v1
  reasoning_effort: ${KENSHI_AGENT_ADVISOR_REASONING_EFFORT:-medium}
  # The advisor client owns this allowance. A playing model's ordinary plan-step
  # timeout cannot silently shorten a read-only hosted call.
  timeout_seconds: 90
  max_output_tokens: 2500
  max_output_continuations: 2
  corpus_file: ../knowledge/kenshi_strategy_v1.yaml
  max_calls_per_run: 4
  cooldown_steps: 12
  cadence_steps: ${KENSHI_AGENT_ADVISOR_CADENCE_STEPS:-20}
  stall_repeat_threshold: 3
  stall_window_actions: 12
  provider_sort: latency
  require_parameters: false

telemetry:
  file: ${KENSHI_AGENT_TELEMETRY_DIR:-$LOCALAPPDATA/KenshiAgent}/telemetry.latest.json
  max_age_seconds: 3.0
  read_retries: 4
  retry_delay_seconds: 0.04
  require_protocol_major: 1

capture:
  enabled: true
  window_title_contains: Kenshi 1.0.
  image_format: png

launch:
  # Steam being open is insufficient: fail before launch unless its own
  # connection log says this local client is actually logged on.
  require_steam_logged_on: true
  # Launch never silently mutates graphics settings. `./dev setup graphics`
  # installs this reversible profile; launch only verifies an exact match.
  require_graphics_profile: true
  graphics_profile_file: graphics/iris-xe-stability-v3.yaml
  # Calibration still requires the external 1920x1080 display. The supported
  # launcher leaves the current topology intact unless --focus-display is used.
  require_dual_display_topology: true
  monitor_gpu_tdr: true
  # Intel Iris Xe shares system RAM. Refuse a test while host headroom is
  # already below a conservative four-GiB boundary.
  min_free_physical_memory_mib: 4096
  # If WSL file cache is the pressure source, the supported launcher may drop
  # that cache once as WSL root, then must re-prove this same Windows threshold.
  reclaim_wsl_cache_on_low_memory: true
  wsl_cache_reclaim_settle_timeout_seconds: 45
  wsl_cache_reclaim_poll_seconds: 1
  # The authenticated device reset occurred 33 seconds after save load.
  # Successful startup must remain fresh, loaded, and paused beyond that point.
  post_load_health_seconds: 45

controls:
  pause_key: space
  speed_keys:
    1: f2
    2: f3
    3: f4
  focus_before_input: true
  post_input_delay_seconds: 0.10
  polite_input_enabled: true
  idle_seconds_before_input: 1.25
  max_wait_for_input_turn_seconds: 60
  restore_foreground_after_input: true
  restore_cursor_after_input: true
  alt_tab_after_input: true
  # Kenshi ignores absolute cursor teleports while it owns the mouse. Small
  # relative SendInput corrections keep its drawn cursor synchronized.
  pointer_mode: relative
  relative_pointer_max_step_pixels: 12
  relative_pointer_tolerance_pixels: 1
  relative_pointer_settle_seconds: 0.006
  relative_pointer_max_attempts: 500
  # All current HUD, dialogue, trade, and movement pointer envelopes were
  # measured at this exact client size. A mismatch must emit no pointer input.
  calibrated_client_width: 1920
  calibrated_client_height: 1080
  # Startup uses exact current MyGUI labels and their live exported bounds.
  # These are not fixed coordinates and remain valid across client sizes.
  startup_continue_control_labels:
    - Continue
  startup_new_game_control_labels:
    - New Game
  startup_begin_control_labels:
    - Begin
  startup_confirm_control_labels:
    - Confirm
  startup_game_start_max_carousel_steps: 64
  startup_load_control_labels:
    - Load Game
    - Load
  startup_save_control_labels:
    - autosave1
  # One pathing order, then up to this much bounded walking, re-pausing after
  # every pulse so the operator always has a stopping point.
  native_approach_max_seconds: 40.0
  native_movement_pulse_seconds: 2.0
  # The world runs; the character just walks.
  require_paused_between_actions: false
  # One model request owns no gestures. The controller follows the selected
  # portrait, searches at most two lower floors, applies its fixed zoom/orbit/tilt
  # sequence, scores retained frames, and leaves a running world paused if it
  # had to intervene.
  camera_recovery:
    candidate_settle_seconds: 0.30
    clear_score_threshold: 0.72
    anchor_max_distance: 30.0
    max_lower_floors: 2

safety:
  # The canonical live policy permits only the audited surface below. The CLI must still
  # receive --execute-live-actions plus the native-assisted and continuous-live
  # acknowledgements before any input is sent.
  live_actions_enabled: true
  emergency_stop_key: f12
  supervisor_enabled: true
  supervisor_max_sequence_stalls: 3
  supervisor_sequence_stall_min_age_seconds: 1.0
  supervisor_pause_timeout_seconds: 2.0
  # An agent playing continuously runs an unpaused game; that is Kenshi working,
  # not an anomaly. Every other reflex still applies - threats, stale telemetry,
  # capability loss, human input, F12.
  require_paused_between_actions: false
  # Human input first receives explicit ownership. After three quiet seconds,
  # a visible five-second countdown starts; any new input resets it and F12
  # disarms automatic takeover for the run.
  automatic_takeover_enabled: true
  human_control_quiet_seconds: 3.0
  takeover_countdown_seconds: 5.0
  takeover_poll_seconds: 0.1
  max_primitive_actions_per_step: 4
  # Does not loosen the four-primitive cap for ordinary operations.
  max_controller_verified_primitive_actions_per_step: 45
  max_actions_per_minute: 120
  max_wait_seconds: 8.0
  block_clicks_when_telemetry_stale: true
  # Continuous live play explicitly authorizes a running world. set_speed
  # owns any required 1x start before selecting a faster ordinal gear.
  allow_live_unpause_actions: true
  # Unset: the agent trades freely under this policy. Exact current cell, item,
  # owner-window and seller binding prevents the wrong-item click. The exported
  # item_value is base worth, not an authoritative shop charge, so no preventive
  # price guarantee is claimed; later money telemetry reveals the actual debit.
  allow_action_kinds:
    - noop
    - stop
    - pause
    - set_speed
    - wait
    - perform_context_action
    - approach_dialogue_target
    - command_world_target
    - select_squad_member
    - select_squad_member_exact
    - rotate_camera
    - survey_local_resources
    - move_to_character
    - move_in_direction
    - travel_to_map_destination
    - exit_current_building
    - harvest_resource
    - respond_to_immediate_threat
    - regroup_with_squad_member
    - produce_resource_output
    - open_context_inventory
    - activate_visible_control
    - dismiss_screen
    - purchase_item
    - open_screen
    - use_game_binding
    - scroll_screen
    - sell_item
    - equip_item
    - collect_resource_output
    - recover_camera_view
    - consult_advisor
    - recall_memory
    - read_fieldbook
memory:
  enabled: true
  retrieval_policy: deterministic
  # This configuration is generic and cannot choose a save lineage. Pass
  # `./dev run --campaign <save-lineage>` or use an attested scenario.
  campaign_id: null
  max_recalled_memories: 16
  max_entity_recalled_memories: 8
  # Open commitments and unresolved hypotheses get protected space so a
  # loud general fact cannot push out what the plan is actually for.
  max_commitment_memories: 4
  max_hypothesis_memories: 2
  max_fieldbook_projects: 8
  minimum_salience: 0.2
