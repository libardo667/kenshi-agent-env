facts:
  - fact_id: greenfruit_is_ingredient
    claim: Greenfruit is a cooking ingredient, not an edible food item by itself.
    source_ids:
      - reddit_greenfruit_not_food
    tags: [food, survival, economy]
    confidence: high
    note: This matters because an inventory can contain Greenfruit while the character still has no edible food.

  - fact_id: food_should_be_verified_as_edible
    claim: Hunger is addressed by items classified as food; ingredient names alone do not establish that an item can be eaten.
    source_ids:
      - kenshi_wiki_food
      - reddit_greenfruit_not_food
    tags: [food, survival, general]
    confidence: high

  - fact_id: hunger_thresholds
    claim: Player hunger is shown on a 0-to-300 reserve. Characters with ordinary food begin automatic eating below 250, suffer malnutrition and stat penalties below 200, and begin hunger fainting below roughly 100 with the exact onset tied to their KO point.
    source_ids:
      - fandom_guide_to_health
      - kenshi_wiki_food
    tags: [food, survival, general]
    confidence: high
    note: Native telemetry exports the same reserve divided by 100, so 2.47 corresponds to about 247 on the HUD scale.

  - fact_id: edible_ingredients_have_a_later_eating_threshold
    claim: If a character carries only food items that are also edible ingredients, automatic eating may wait until the hunger reserve drops below 200 rather than 250.
    source_ids:
      - kenshi_wiki_food
    tags: [food, survival, general]
    confidence: high

  - fact_id: persistent_jobs_use_shift_right_click
    claim: Holding Shift while right-clicking a task adds it to the selected character's ordered Jobs list; enabled characters attempt jobs from the top and may fall through when a higher job cannot run.
    source_ids:
      - kenshi_wiki_jobs
    tags: [economy, general]
    confidence: high
    note: This is distinct from issuing an immediate default or context-menu command without Shift.

  - fact_id: right_click_commands_and_context_menu
    claim: Holding the right mouse button on a person, building, or supported object opens its action menu, while an ordinary right-click performs the current default action.
    source_ids:
      - kenshi_wiki_controls
    tags: [general]
    confidence: high
    note: The exact menu entries and default action remain current-world evidence and must not be inferred from object type alone.

  - fact_id: squad_selection_supports_multiple_characters
    claim: Kenshi supports multi-character control through Shift-left-click selection, drag-box selection, and a select-all-squad binding.
    source_ids:
      - kenshi_wiki_controls
    tags: [general]
    confidence: high

  - fact_id: strength_training_is_activity_bound
    claim: Strength can improve through travel while heavily encumbered, carrying another character, and appropriate combat activity such as using demanding weapons.
    source_ids:
      - kenshi_wiki_strength
      - fandom_getting_started
    tags: [general]
    confidence: high
    note: These are possible mechanics, not a recommendation that the current squad should train this way.

  - fact_id: toughness_training_is_activity_bound
    claim: Toughness gains from received damage, and getting up instead of remaining in the Playing Dead state can grant a much larger gain while enemies are nearby.
    source_ids:
      - fandom_training_statistics
    tags: [general]
    confidence: high
    note: Deliberately seeking this progression can still be lethal or lead to capture, enslavement, or being eaten depending on the opponent and location.

  - fact_id: hub_has_nearby_ore
    claim: The Hub has nearby copper and iron resources, making mining and selling ore one available early-money route.
    source_ids:
      - fandom_the_hub
      - steam_objective_guide_reignswolf
    tags: [economy, next_goal]
    confidence: high

  - fact_id: mining_is_one_route_not_a_mandate
    claim: Mining copper is a common beginner income route, but the guide also lists scavenging, bounties, crafting, trade, and other alternatives.
    source_ids:
      - steam_objective_guide_reignswolf
    tags: [economy, next_goal, general]
    confidence: medium
    note: Present mining as an option whose safety and control affordances must fit the current world, not as universal consensus.

  - fact_id: early_combat_is_dangerous
    claim: Weak early characters can use town guards as protection and scavenge defeated attackers rather than taking unsupported fights.
    source_ids:
      - steam_objective_guide_reignswolf
      - fandom_getting_started
    tags: [survival, economy, next_goal]
    confidence: medium

  - fact_id: medical_supplies_matter
    claim: Early squads should carry medical supplies because untreated bleeding can turn a recoverable defeat into death.
    source_ids:
      - steam_objective_guide_reignswolf
      - fandom_getting_started
    tags: [survival, recruitment, next_goal]
    confidence: high

  - fact_id: mercenary_cost_scale
    claim: Mercenary Captains commonly offer bodyguard contracts around 2,000 Cats per day and outpost protection around 1,000 Cats per day.
    source_ids:
      - fandom_mercenary_captain
    tags: [survival, recruitment, economy]
    confidence: medium
    note: Treat prices as guide-scale estimates and verify the current dialogue and money before committing.

  - fact_id: more_people_tradeoffs
    claim: Additional recruits can improve work capacity and group safety, but they also increase food needs and require enough cash to recruit and equip.
    source_ids:
      - steam_objective_guide_reignswolf
      - fandom_getting_started
    tags: [recruitment, food, survival, next_goal]
    confidence: medium

  - fact_id: delay_base_building
    claim: A permanent base is a later progression goal after income, supplies, research, and enough people to defend and operate it.
    source_ids:
      - steam_objective_guide_reignswolf
    tags: [next_goal, economy, survival]
    confidence: medium
