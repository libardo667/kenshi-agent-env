[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kenshi-agent-env"
version = "0.1.0"
description = "A bounded live-agent platform for controlling Kenshi through telemetry, vision, semantic actions, and ordinary Windows input."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Kenshi Agent Environment contributors" }]
dependencies = [
  "pydantic>=2.7,<3",
  "PyYAML>=6,<7",
  "Pillow>=10,<13",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
openai = ["openai>=2.0,<3"]
dev = [
  "openai>=2.0,<3",
  "pytest>=8,<10",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
  "types-PyYAML>=6,<7",
  "mutmut>=3.5,<4",
]

[project.scripts]
kenshi-agent = "kenshi_agent.cli:main"
kenshi-mutate = "kenshi_agent.mutation_campaign:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true

[tool.mutmut]
source_paths = ["src/kenshi_agent/"]
do_not_mutate_patterns = [
  "# pragma: no mutate",
  "# mutation: diagnostic-only",
  "# mutation: reason",
]
pytest_add_cli_args_test_selection = ["tests/"]
also_copy = [
  "dev",
  ".env.example",
  ".gitignore",
  "config/",
  "docs/",
  "examples/",
  "game_sources/",
  "knowledge/",
  "native/",
  "prompts/",
  "scenarios/",
  "schemas/",
  "scripts/",
  "ARCHITECTURE.md",
  "CHANGELOG.md",
  "README.md",
  "SECURITY_AND_SAFETY.md",
  "STATUS.md",
]
