[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kenshi-agent-env"
version = "0.1.0"
description = "A bounded live-agent platform for controlling Kenshi through telemetry, vision, semantic actions, and ordinary Windows input."
requires-python = ">=3.11,<3.15"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Kenshi Agent Environment contributors" }]
dependencies = [
  "pydantic>=2.7,<3",
  "PyYAML>=6,<7",
  "Pillow>=10,<13",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
openai = ["openai>=2.0,<3"]
dev = [
  "openai>=2.0,<3",
  "pytest>=8,<10",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
  "types-PyYAML>=6,<7",
]
evogen = [
  "evogen @ git+https://github.com/libardo667/evogen.git@5e72ca364f0a1b2c5b23d41c9af5a2a15099b946 ; python_version < '3.14'",
]

[project.scripts]
kenshi-agent = "kenshi_agent.cli:main"

[project.entry-points."evogen.subjects"]
kenshi = "kenshi_agent.evogen_subject:build_subject_plugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/kenshi-agent-env/evogen" = ["docs/generated/CAPABILITY_MANIFEST.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true

[tool.mutmut]
source_paths = ["src/kenshi_agent/"]
do_not_mutate_patterns = [
  "# pragma: no mutate",
  "# mutation: diagnostic-only",
  "# mutation: reason",
]
pytest_add_cli_args_test_selection = ["tests/"]
also_copy = [
  "dev",
  ".env.example",
  ".gitignore",
  "config/",
  "docs/",
  "examples/",
  "game_sources/",
  "knowledge/",
  "native/",
  "prompts/",
  "scenarios/",
  "schemas/",
  "scripts/",
  "ARCHITECTURE.md",
]
